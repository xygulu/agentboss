[pytest]
# products/deskboss/ 是 ESP32 固件整仓并入（含 vendored LVGL/ESP-IDF 源码），
# 里面的 test_*.py 是上游自带的，不归这套 host/relay 测试管：
# 从仓库根跑 pytest 时别去收集，否则 LVGL 的 gen_json 测试直接 INTERNALERROR。
# 固件自己跑测试就 cd products/deskboss/firmware 再跑，不受这里影响。
norecursedirs = deskboss *.egg .* _darcs build CVS dist node_modules venv _build
